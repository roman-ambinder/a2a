# Two instances of one A2A agent app, sharing Postgres and Redis.
#   docker compose -f samples/MultiInstance/docker-compose.yml up --build -d
#   dotnet run --project samples/MultiInstance/Client
#   docker compose -f samples/MultiInstance/docker-compose.yml down -v
# The API key and the database password are demo values. Change them for anything real.
x-agent: &agent
  build:
    context: ../..
    dockerfile: samples/MultiInstance/Dockerfile
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  environment: &agent-env
    ApiKey: demo-key-change-me
    ConnectionStrings__a2a: Host=postgres;Database=a2a;Username=a2a;Password=a2a-demo
    ConnectionStrings__redis: redis:6379

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: a2a
      POSTGRES_USER: a2a
      POSTGRES_PASSWORD: a2a-demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a2a -d a2a"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  agent-a:
    <<: *agent
    environment:
      <<: *agent-env
      Instance: agent-a
      PublicUrl: http://localhost:5101
    ports: ["127.0.0.1:5101:8080"]

  agent-b:
    <<: *agent
    environment:
      <<: *agent-env
      Instance: agent-b
      PublicUrl: http://localhost:5102
    ports: ["127.0.0.1:5102:8080"]
