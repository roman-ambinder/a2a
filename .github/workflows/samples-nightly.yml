name: Samples (Docker, nightly)

# The samples that need Docker: MultiInstance (Postgres + Redis), ArtifactStorage (MinIO + Azurite) and
# ClientOutbox (Postgres). They are slower than the others, so they run once a night and on demand, not on every push.
on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  docker-samples:
    name: Docker samples
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Fail instead of skipping when Docker is missing.
      A2A_REQUIRE_DOCKER: '1'
      SAMPLES_LOG_DIR: ${{ github.workspace }}/sample-logs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run the Docker samples
        run: samples/run-samples.sh multi storage outbox

      - name: Upload sample logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sample-logs-docker
          path: sample-logs
          if-no-files-found: warn
