name: Coverage

# Line coverage per package, checked against .github/coverage-baseline.json (a ratchet: coverage may rise, not fall).
# Its own workflow, not a job in ci.yml: release.yml needs ci.yml to succeed for the commit, and a coverage drop should
# turn this check red without blocking a release. Instrumentation slows tests and can add timing flakes, so it runs
# after merges and on demand (workflow_dispatch, on any branch), never on every pull request.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.sha }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  coverage:
    name: Coverage (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The store tests run here too (Postgres, Redis, MinIO, Azurite). Fail instead of skipping when Docker is missing,
      # or the store packages would report no data.
      A2A_REQUIRE_DOCKER: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test with coverage (net10.0)
        run: |
          status=0
          for p in A2A.Tests A2A.Grpc.Tests A2A.V0_3Compat.Tests A2A.Extensions.AI.Tests A2A.Mcp.Tests A2A.TestKit.Tests A2A.Stores.Tests; do
            dotnet test --project "tests/$p/$p.csproj" -c Release -f net10.0 -p:A2ACoverage=true --coverage --coverage-output-format cobertura --results-directory coverage || status=1
          done
          exit $status

      - name: Check against the baseline
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 .github/scripts/coverage_summary.py coverage \
            --baseline .github/coverage-baseline.json \
            --write-baseline coverage/baseline-candidate.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/**/*.cobertura.xml
            coverage/baseline-candidate.json
          if-no-files-found: warn
