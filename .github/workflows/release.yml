name: Release

# Publishes all packages to nuget.org when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# Tags with a suffix (v0.2.0-preview.1) publish prereleases.
# Requires the repository secret NUGET_API_KEY (nuget.org API key scoped to "RomanAmbinder.A2A.*" push).

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write # create the GitHub release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  ci-gate:
    name: Require green CI for the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Passes only when ci.yml succeeded on a push to main for this exact commit, so a tag on an unmerged
      # or red commit cannot publish. Waits if that run is still going, for tags pushed right after a merge.
      - name: Wait for a successful CI run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD) # HEAD, not GITHUB_SHA: always the commit, also for annotated tags
          while true; do
            runs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$commit" -f branch=main -f event=push --jq '.workflow_runs')
            if jq -e 'any(.conclusion == "success")' <<<"$runs" > /dev/null; then
              echo "CI passed for $commit"
              exit 0
            fi
            if jq -e 'any(.status != "completed")' <<<"$runs" > /dev/null; then
              echo "CI still running for $commit; checking again in 30 s"
              sleep 30
              continue
            fi
            echo "::error::No successful CI run on main for $commit. Merge to main, get CI green (re-run it if needed), then re-run this workflow."
            exit 1
          done

  release:
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$VERSION" == *-* ]]; then echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV"; fi
          echo "Releasing $VERSION"

      - name: Check NuGet API key
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::Repository secret NUGET_API_KEY is not set."
            exit 1
          fi

      - name: Build
        run: dotnet build A2A.slnx -c Release -p:Version="$VERSION"

      - name: Pack
        run: |
          for p in src/*/*.csproj; do
            dotnet pack "$p" -c Release --no-build -p:Version="$VERSION" -o artifacts
          done
          ls -l artifacts

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE
