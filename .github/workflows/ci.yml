name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs replace older runs of the same PR. Runs on main each get their own group: GitHub keeps only one pending
  # run per group, so a shared group would still drop a merge in a burst of merges. Release also needs each commit's run.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore A2A.slnx

      - name: Build (warnings as errors in src)
        id: build
        run: dotnet build A2A.slnx -c Release --no-restore

      - name: Test (net10.0)
        run: dotnet test --project tests/A2A.Tests/A2A.Tests.csproj -c Release --no-build --report-xunit-trx --results-directory TestResults

      # Run every suite even if an earlier one failed, so one run shows all results. The job still fails. No use after a failed build.
      - name: Test gRPC (net10.0)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test --project tests/A2A.Grpc.Tests/A2A.Grpc.Tests.csproj -c Release --no-build --report-xunit-trx --results-directory TestResults

      - name: Test v0.3 compat (net10.0)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test --project tests/A2A.V0_3Compat.Tests/A2A.V0_3Compat.Tests.csproj -c Release --no-build --report-xunit-trx --results-directory TestResults

      - name: Test Extensions.AI (net10.0)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test --project tests/A2A.Extensions.AI.Tests/A2A.Extensions.AI.Tests.csproj -c Release --no-build --report-xunit-trx --results-directory TestResults
      - name: Test Mcp (net10.0)
        run: dotnet test --project tests/A2A.Mcp.Tests/A2A.Mcp.Tests.csproj -c Release --no-build --report-xunit-trx --results-directory TestResults

      - name: Test TestKit (net10.0)
        run: dotnet test --project tests/A2A.TestKit.Tests/A2A.TestKit.Tests.csproj -c Release --no-build --report-xunit-trx --results-directory TestResults

      - name: Test TestingAgent sample (net10.0)
        run: dotnet test --project samples/TestingAgent/TestingAgent.csproj -c Release --no-build --report-xunit-trx --results-directory TestResults

      # D25: the netstandard2.0 builds of A2A.Protocol and A2A.Client against a real EchoAgent process.
      # net10.0 runs the netstandard2.0 DLLs on every OS; net48 runs them on .NET Framework (Windows only).
      - name: Smoke test netstandard2.0 (net10.0, and net48 on Windows)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          SMOKE_URL: http://127.0.0.1:18741
          SMOKE_KEY: smoke-test-key
        run: |
          set -eu
          dotnet samples/EchoAgent/bin/Release/net10.0/EchoAgent.dll "--BaseUrl=$SMOKE_URL" "--EchoAgent:ApiKey=$SMOKE_KEY" > "$RUNNER_TEMP/echoagent.log" 2>&1 &
          agent=$!
          trap 'kill "$agent" 2>/dev/null || true' EXIT
          up=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "$SMOKE_URL/.well-known/agent-card.json"; then up=1; break; fi
            sleep 1
          done
          if [ "$up" != 1 ]; then echo "EchoAgent did not answer within 60 s"; cat "$RUNNER_TEMP/echoagent.log"; exit 1; fi
          dotnet run --no-build -c Release -f net10.0 --project tests/A2A.NetStandard.Smoke -- "$SMOKE_URL" "$SMOKE_KEY"
          if [ "$RUNNER_OS" = "Windows" ]; then
            tests/A2A.NetStandard.Smoke/bin/Release/net48/A2A.NetStandard.Smoke.exe "$SMOKE_URL" "$SMOKE_KEY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: warn

  stores:
    name: Durable stores (Postgres + Redis + MinIO + Azurite, Testcontainers)
    runs-on: ubuntu-latest
    env:
      # Fail instead of skipping when Docker is missing.
      A2A_REQUIRE_DOCKER: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test store contracts (in-memory, PostgreSQL, Redis, S3 on MinIO, Azure Blob on Azurite; net10.0)
        run: dotnet test --project tests/A2A.Stores.Tests/A2A.Stores.Tests.csproj -c Release --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-stores
          path: TestResults/*.trx
          if-no-files-found: warn

  interop:
    name: Interop (official Python a2a-sdk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: interop/python/requirements.txt

      - name: Install Python SDK
        run: pip install -r interop/python/requirements.txt

      - name: Run two-way interop (JSON-RPC + HTTP+JSON)
        run: PYTHON=python interop/run.sh

  conformance:
    name: Conformance (a2a-tck + ACTS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.18'

      # Suites are pinned in conformance/run.sh. Fails only on failures missing from conformance/expected-failures.txt.
      - name: Run conformance suites (JSON-RPC, HTTP+JSON, gRPC)
        run: conformance/run.sh

      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-results
          path: conformance/results/
          if-no-files-found: warn

  interop-v03:
    name: Interop v0.3 compat (official Python a2a-sdk 0.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Two venvs: a2a-sdk 0.3 and a2a-sdk 1.x cannot share one.
      - name: Install Python SDKs
        run: |
          python -m venv interop/v03/python/.venv
          interop/v03/python/.venv/bin/pip install -r interop/v03/python/requirements.txt
          python -m venv interop/python/.venv
          interop/python/.venv/bin/pip install -r interop/python/requirements.txt

      - name: Run v0.3 interop (JSON-RPC + HTTP+JSON)
        run: interop/v03/run.sh

  pack:
    name: Pack NuGet packages
    needs: build-test
    # build-test is a matrix, so `needs` waits for every OS. Still run when only one OS failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: |
          for p in src/*/*.csproj; do
            dotnet pack "$p" -c Release -o artifacts
          done

      - name: Test the dotnet new templates against the packed SDK (and the packed analyzers)
        run: src/A2A.Templates/test-templates.sh artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*.nupkg

  benchmarks:
    name: Benchmarks (regression check)
    # Blocking: fails on an allocation regression over 10% against tests/A2A.Benchmarks/baseline.json (from an ubuntu-latest run).
    needs: build-test
    # build-test is a matrix, so `needs` waits for every OS. Still run when only one OS failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run benchmarks
        run: dotnet run -c Release --project tests/A2A.Benchmarks -- --job short --exporters json --filter '*'

      - name: Compare with committed baseline (allocation regression, 10%)
        # One `--job short` run varies by about 7 points on allocations. If the first comparison fails, measure once more and
        # fail only when the second comparison fails too. A real regression fails both. Both tables are printed.
        run: |
          compare() { python3 tests/A2A.Benchmarks/compare.py BenchmarkDotNet.Artifacts/results tests/A2A.Benchmarks/baseline.json --threshold 0.10; }
          if compare; then exit 0; fi
          echo "::warning::Benchmark comparison failed. Running the benchmarks once more to rule out noise."
          rm -rf BenchmarkDotNet.Artifacts
          dotnet run -c Release --project tests/A2A.Benchmarks -- --job short --exporters json --filter '*'
          compare

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results
          if-no-files-found: warn

  aot-publish:
    name: AOT publish (samples)
    needs: build-test
    # build-test is a matrix, so `needs` waits for every OS. Still run when only one OS failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # pipefail: without it the step's status is tee's, so a failed publish passed. A2APublishAot (Directory.Build.props)
      # sets PublishAot only outside netstandard2.0; a global -p:PublishAot=true fails there with NETSDK1207.
      - name: Publish EchoAgent (native AOT) and check for trim/AOT warnings
        run: |
          set -o pipefail
          dotnet publish samples/EchoAgent -c Release -f net10.0 -r linux-x64 -p:A2APublishAot=true 2>&1 | tee publish-agent.log
          grep -E 'warning IL(2|3)[0-9]{3}' publish-agent.log > warnings-agent.txt || true
          cat warnings-agent.txt
          test ! -s warnings-agent.txt

      - name: Publish EchoClient (native AOT) and check for trim/AOT warnings
        run: |
          set -o pipefail
          dotnet publish samples/EchoClient -c Release -f net10.0 -r linux-x64 -p:A2APublishAot=true 2>&1 | tee publish-client.log
          grep -E 'warning IL(2|3)[0-9]{3}' publish-client.log > warnings-client.txt || true
          cat warnings-client.txt
          test ! -s warnings-client.txt

      - name: Publish a2a CLI (native AOT) and check for trim/AOT warnings
        run: |
          set -o pipefail
          dotnet publish src/A2A.Cli -c Release -f net10.0 -r linux-x64 -p:A2APublishAot=true 2>&1 | tee publish-cli.log
          grep -E 'warning IL(2|3)[0-9]{3}' publish-cli.log > warnings-cli.txt || true
          cat warnings-cli.txt
          test ! -s warnings-cli.txt

  docs:
    name: Docs site (DocFX)
    runs-on: ubuntu-latest
    env:
      LYCHEE_VERSION: v0.24.2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Build guide snippets (warnings as errors)
        run: dotnet build samples/Snippets/Snippets.csproj -c Release

      - name: Check guides (no C# fences, repo links and snippet regions exist)
        run: python3 docs/site/check-guides.py

      - name: Build site (broken links and bad xrefs fail)
        run: dotnet docfx docs/site/docfx.json --warningsAsErrors

      - name: Restore lychee from cache
        id: lychee-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/lychee
          key: lychee-${{ env.LYCHEE_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install lychee
        # Not lychee-action: it downloads the binary with no retry, so one network blip fails the job.
        # GitHub release downloads sometimes return 504 for minutes, so cache the binary and wait longer between retries.
        env:
          CACHE_HIT: ${{ steps.lychee-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$CACHE_HIT" != "true" ]; then
            asset=lychee-x86_64-unknown-linux-gnu.tar.gz
            url="https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}"
            fetch() {
              curl -fsSL --retry 8 --retry-all-errors --retry-delay 30 --connect-timeout 30 --max-time 120 -O "$1"
            }
            mkdir -p "$RUNNER_TEMP/lychee"
            cd "$RUNNER_TEMP/lychee"
            fetch "$url/$asset"
            fetch "$url/$asset.sha256"
            sha256sum -c "$asset.sha256"
            tar -xzf "$asset"
            rm -f "$asset" "$asset.sha256"
          fi
          echo "$RUNNER_TEMP/lychee/lychee-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Check links between generated pages
        run: lychee --offline --no-progress 'docs/site/_site/**/*.html'

      - name: Check external links in guides and home page
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # API pages link to learn.microsoft.com heavily, so only the hand-written markdown is checked.
        # This private repo is covered by check-guides.py.
        # 502 to 504 are the remote host having a bad moment, not a dead link; they failed main with a 504 from github.com.
        run: >-
          lychee
          --no-progress --max-retries 3 --retry-wait-time 5 --timeout 30
          --accept '100..=399,429,502..=504'
          --exclude 'github\.com/roman-ambinder/a2a'
          'docs/site/index.md' 'docs/site/guides/*.md'

      - name: Upload site
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs/site/_site
          if-no-files-found: error

  coverage:
    name: Coverage report
    # Report only. Instrumentation slows tests and would add timing flakes, so it runs after merges, never on a pull request,
    # and it is deliberately not in all-green. Store tests need containers and are not included.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test with coverage (net10.0)
        run: |
          status=0
          for p in A2A.Tests A2A.Grpc.Tests A2A.V0_3Compat.Tests A2A.Extensions.AI.Tests A2A.Mcp.Tests A2A.TestKit.Tests; do
            dotnet test --project "tests/$p/$p.csproj" -c Release -f net10.0 -p:A2ACoverage=true --coverage --coverage-output-format cobertura --results-directory coverage || status=1
          done
          exit $status

      - name: Write summary
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/coverage_summary.py coverage >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/**/*.cobertura.xml
          if-no-files-found: warn

  samples:
    name: Samples (run-samples.sh, no Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Every sample that needs no Docker, each checked by its own OK: line. The Docker ones run nightly
      # (samples-nightly.yml).
      - name: Run the samples
        env:
          SAMPLES_LOG_DIR: ${{ runner.temp }}/sample-logs
        run: samples/run-samples.sh

      - name: Upload sample logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sample-logs
          path: ${{ runner.temp }}/sample-logs
          if-no-files-found: warn

  all-green:
    name: all-green
    # The single check to require in branch protection. `always()` matters: a skipped job counts as passing a required
    # check, so this job must run after a failure or cancel and report it. List every job here.
    if: ${{ always() }}
    needs: [build-test, stores, interop, conformance, interop-v03, pack, benchmarks, aot-publish, docs, samples]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.result == "success")' > /dev/null
