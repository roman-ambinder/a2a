name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore A2A.slnx

      - name: Build (warnings as errors in src)
        run: dotnet build A2A.slnx -c Release --no-restore

      - name: Test (net8.0 + net10.0)
        run: dotnet test tests/A2A.Tests/A2A.Tests.csproj -c Release --no-build --logger "trx;LogFilePrefix=results" --results-directory TestResults

      - name: Test gRPC (net8.0 + net10.0)
        run: dotnet test tests/A2A.Grpc.Tests/A2A.Grpc.Tests.csproj -c Release --no-build --logger "trx;LogFilePrefix=grpc-results" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: warn

  stores:
    name: Durable stores (Postgres + Redis, Testcontainers)
    runs-on: ubuntu-latest
    env:
      # Fail instead of skipping when Docker is missing.
      A2A_REQUIRE_DOCKER: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test store contracts (in-memory, PostgreSQL, Redis; net8.0 + net10.0)
        run: dotnet test tests/A2A.Stores.Tests/A2A.Stores.Tests.csproj -c Release --logger "trx;LogFilePrefix=stores" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-stores
          path: TestResults/*.trx
          if-no-files-found: warn

  interop:
    name: Interop (official Python a2a-sdk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: interop/python/requirements.txt

      - name: Install Python SDK
        run: pip install -r interop/python/requirements.txt

      - name: Run two-way interop (JSON-RPC + HTTP+JSON)
        run: PYTHON=python interop/run.sh

  pack:
    name: Pack NuGet packages
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        run: |
          for p in src/*/*.csproj; do
            dotnet pack "$p" -c Release -o artifacts
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg

  benchmarks:
    name: Benchmarks (regression check)
    # Blocking: fails on an allocation regression over 10% against tests/A2A.Benchmarks/baseline.json (from an ubuntu-latest run).
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run benchmarks
        run: dotnet run -c Release --project tests/A2A.Benchmarks -- --job short --exporters json --filter '*'

      - name: Compare with committed baseline (allocation regression, 10%)
        run: python3 tests/A2A.Benchmarks/compare.py BenchmarkDotNet.Artifacts/results tests/A2A.Benchmarks/baseline.json --threshold 0.10

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results
          if-no-files-found: warn

  aot-publish:
    name: AOT publish (samples)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish EchoAgent (native AOT) and check for trim/AOT warnings
        run: |
          dotnet publish samples/EchoAgent -c Release -f net10.0 -r linux-x64 -p:PublishAot=true 2>&1 | tee publish-agent.log
          grep -E 'warning IL(2|3)[0-9]{3}' publish-agent.log > warnings-agent.txt || true
          cat warnings-agent.txt
          test ! -s warnings-agent.txt

      - name: Publish EchoClient (native AOT) and check for trim/AOT warnings
        run: |
          dotnet publish samples/EchoClient -c Release -f net10.0 -r linux-x64 -p:PublishAot=true 2>&1 | tee publish-client.log
          grep -E 'warning IL(2|3)[0-9]{3}' publish-client.log > warnings-client.txt || true
          cat warnings-client.txt
          test ! -s warnings-client.txt
